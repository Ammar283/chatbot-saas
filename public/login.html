<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — Front Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:#171A17; --paper:#EFF1EC; --pine:#1B3A2F; --brass:#B8862B;
    --mist:#D8DDD3; --muted:#5F6860; --clay:#A8412F;
    --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
    --body:"Inter",ui-sans-serif,system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--body); background:var(--pine); color:var(--ink); min-height:100vh;
         display:grid; place-items:center; padding:24px; font-size:14px; }
  .card { background:#fff; border-radius:14px; padding:34px 32px; width:100%; max-width:380px;
          box-shadow:0 24px 70px rgba(0,0,0,.3); }
  .brand { font-family:var(--display); font-weight:700; font-size:23px; letter-spacing:-.02em; color:var(--pine); }
  .brand em { display:block; font-style:normal; font-family:var(--mono); font-size:10px;
              letter-spacing:.15em; text-transform:uppercase; color:var(--muted); margin-top:5px; }
  h1 { font-family:var(--display); font-size:17px; font-weight:600; margin:26px 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  label { display:block; font-weight:500; margin-bottom:5px; font-size:13px; }
  input { width:100%; border:1px solid var(--mist); border-radius:8px; padding:10px 12px;
          font-family:inherit; font-size:14px; margin-bottom:14px; background:#fff; color:var(--ink); }
  input:focus { outline:2px solid var(--pine); outline-offset:-1px; }
  button { width:100%; background:var(--pine); color:#fff; border:0; border-radius:8px;
           padding:11px; font-family:inherit; font-size:14px; font-weight:500; cursor:pointer; }
  button:hover { background:#24503F; }
  button:disabled { opacity:.6; cursor:default; }
  .err { background:#FBEFED; border-left:3px solid var(--clay); color:#7A2C20;
         padding:9px 12px; border-radius:0 7px 7px 0; font-size:13px; margin-bottom:16px; display:none; }
  .err.on { display:block; }
  .foot { margin-top:20px; font-size:12px; color:var(--muted); text-align:center; line-height:1.5; }
  .foot a { color:var(--pine); }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">Front Desk<em>chatbot console</em></div>
    <h1>Sign in</h1>
    <p class="sub">Manage your chatbot, knowledge and leads.</p>

    <div class="err" id="err"></div>

    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" autofocus />

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" />

    <button id="go">Sign in</button>

    <p class="foot">Forgotten your password? Ask whoever set up your account to reset it.</p>
  </main>

<script>
const $ = (s) => document.querySelector(s);

function fail(msg) {
  const e = $('#err');
  e.textContent = msg;
  e.classList.add('on');
}

async function signIn() {
  const btn = $('#go');
  $('#err').classList.remove('on');
  const email = $('#email').value.trim();
  const password = $('#password').value;
  if (!email || !password) return fail('Enter your email and password.');

  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not sign in.');
    location.href = data.role === 'owner' ? '/dashboard.html?owner=1' : '/dashboard.html';
  } catch (e) {
    fail(e.message);
    btn.disabled = false; btn.textContent = 'Sign in';
  }
}

$('#go').addEventListener('click', signIn);
document.addEventListener('keydown', (e) => { if (e.key === 'Enter') signIn(); });
</script>
</body>
</html>
